<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Examples rows — separator treatments</title>
    <style>
      /* Scratch demo for the playground examples table. Not shipped.
         Same stone palette / type scale as the app so the comparison is fair. */
      :root {
        --ink: #44403c;
        --muted: #a8a29e;
        --faint: #d6d3d1;
        --hair: #f5f5f4;
        --rule: #e7e5e4;
        --mark: #fef3c7;
        --panel: #fff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 40px 32px 96px;
        background: #fafaf9;
        color: var(--ink);
        font: 400 16px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      h1 { font-size: 20px; letter-spacing: -0.01em; margin: 0 0 4px; }
      .sub { color: #78716c; font-size: 13px; margin: 0 0 32px; }
      h2 {
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
        color: var(--muted); font-weight: 600; margin: 40px 0 12px;
      }
      .grid { display: grid; gap: 20px; grid-template-columns: repeat(auto-fill, minmax(430px, 1fr)); }
      .card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px 16px; }
      .label { font-size: 11px; color: var(--muted); margin: 0 0 10px; font-variant-numeric: tabular-nums; }
      .label b { color: #57534e; font-weight: 600; }
      table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 12px; text-align: left; }
      col.src { width: 26%; } col.alb { width: 44%; } col.ctx { width: 30%; }
      th {
        font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--muted); font-weight: 600; padding: 6px 16px 6px 0;
        border-bottom: 1px solid var(--rule);
      }
      th:last-child { padding-right: 0; }
      td { padding: 10px 16px 10px 0; vertical-align: top; line-height: 1.6; }
      td:last-child { padding-right: 0; color: #78716c; }
      .corpus { font-weight: 500; color: #44403c; text-decoration: underline; text-underline-offset: 2px; }
      .meta { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
      mark { background: var(--mark); color: #0c0a09; border-radius: 2px; padding: 0 2px; }

      /* ---- 1–12: separator treatments -------------------------------- */
      .v-rule tbody tr + tr td { border-top: 1px solid var(--rule); }
      .v-hair tbody tr + tr td { border-top: 1px solid var(--hair); }
      .v-inset tbody tr + tr td { border-top: 1px solid var(--rule); }
      .v-inset tbody tr + tr td:first-child { border-top-color: transparent; }
      .v-dotted tbody tr + tr td { border-top: 1px dotted var(--faint); }
      .v-dashed tbody tr + tr td { border-top: 1px dashed var(--faint); }
      .v-zebra tbody tr:nth-child(even) td { background: #fafaf9; }
      .v-air td { padding-top: 14px; padding-bottom: 14px; }
      .v-bar tbody td:first-child { box-shadow: inset 2px 0 0 var(--rule); padding-left: 10px; }

      /* the dot marker, hung in the first column's left margin */
      .dot tbody td:first-child { position: relative; padding-left: 14px; }
      .dot tbody td:first-child::before {
        content: ""; position: absolute; left: 0; top: 15px;
        width: 4px; height: 4px; border-radius: 50%; background: var(--faint);
      }
      .dot-ink tbody td:first-child::before { background: #a8a29e; }
      .dot-open tbody td:first-child::before {
        background: transparent; box-shadow: inset 0 0 0 1px var(--muted);
      }
      /* dot sitting on the rule itself, at its left end */
      .dot-on-rule tbody tr + tr td:first-child::after {
        content: ""; position: absolute; left: -2px; top: -3px;
        width: 5px; height: 5px; border-radius: 50%; background: var(--faint);
      }
      /* dot leader running from source to sentence */
      .leader tbody td:first-child { position: relative; }
      .leader tbody td:first-child::after {
        content: ""; position: absolute; right: 6px; bottom: 13px; left: 50%;
        border-bottom: 1px dotted #e7e5e4;
      }

      /* ---- A–E: structural ideas ------------------------------------- */
      .idea { display: grid; gap: 10px; }

      .cards .item {
        border: 1px solid var(--rule); border-radius: 6px; padding: 10px 12px; background: #fff;
      }
      .cards .chip {
        display: inline-block; font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase;
        color: #78716c; background: #f5f5f4; border-radius: 999px; padding: 2px 8px; margin-bottom: 6px;
      }
      .cards .sent { font-size: 13px; line-height: 1.55; }
      .cards .trans { font-size: 11.5px; color: #78716c; margin-top: 4px; }

      .quotes .item { padding-left: 12px; border-left: 2px solid var(--rule); }
      .quotes .sent { font-size: 14px; line-height: 1.5; }
      .quotes .cap { font-size: 10.5px; color: var(--muted); margin-top: 4px; letter-spacing: 0.02em; }

      .stack .item { padding: 8px 0; }
      .stack .head { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
      .stack .sent { font-size: 13px; }
      .stack .src { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
      .stack .trans { font-size: 11.5px; color: #78716c; font-style: italic; margin: 3px 0 0 14px; }
      .stack .item + .item { border-top: 1px solid var(--hair); }

      .gutter .item { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding: 8px 0; }
      .gutter .tag {
        font: 600 10px/1.6 ui-monospace, SFMono-Regular, monospace;
        color: var(--muted); letter-spacing: 0.06em; text-align: right; padding-top: 2px;
      }
      .gutter .sent { font-size: 13px; }
      .gutter .trans { font-size: 11.5px; color: #78716c; margin-top: 2px; }

      .oneline .item {
        display: flex; gap: 10px; align-items: baseline; padding: 7px 0; font-size: 12.5px;
      }
      .oneline .item + .item { border-top: 1px solid var(--hair); }
      .oneline .sent { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .oneline .src { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
      .oneline .item:hover .sent { white-space: normal; }
      .oneline .hint { font-size: 10.5px; color: var(--muted); margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>Examples rows — 12 separator treatments + 5 structural ideas</h1>
    <p class="sub">
      Same three rows of real <code>punoj</code> data in every panel. 1–12 vary
      only the separator: rule / no rule × dot / no dot. A–E change the shape of
      a row entirely.
    </p>

    <h2>Separator treatments</h2>
    <div class="grid" id="variants"></div>

    <h2>Structural ideas</h2>
    <div class="grid" id="ideas"></div>

    <script>
      const ROWS = [
        {
          corpus: 'HPLT v3 Albanian',
          kind: 'exact token',
          domain: 'orikuminews.com',
          pre: 'Kam që në vitin 2014 që ',
          hit: 'punoj',
          post: ' në atë firmë", ka thënë Lushaj.',
          ctx: 'web',
          tag: 'HPLT',
        },
        {
          corpus: 'CC100 Albanian',
          kind: 'exact token',
          domain: '',
          pre: 'Me idenë që do të ',
          hit: 'punoj',
          post: ' sa më shumë në punësim dhe zhvillim ekonomik.',
          ctx: 'local corpus',
          tag: 'CC100',
        },
        {
          corpus: 'Tatoeba',
          kind: 'translated pair',
          domain: 'opus.nlpl.eu',
          pre: '',
          hit: 'Punoj',
          post: ' për McDonald’s.',
          ctx: 'I work for McDonald’s.',
          tag: 'TATO',
        },
      ];

      const VARIANTS = [
        ['1', 'rule, full width', 'v-rule'],
        ['2', 'rule, hairline', 'v-hair'],
        ['3', 'rule, inset past the source column', 'v-inset'],
        ['4', 'dotted rule', 'v-dotted'],
        ['5', 'dashed rule', 'v-dashed'],
        ['6', 'no rule, zebra fill', 'v-zebra'],
        ['7', 'no rule, air only', 'v-air'],
        ['8', 'no rule, dot marker', 'dot'],
        ['9', 'rule + dot marker', 'v-rule dot'],
        ['10', 'rule + open dot marker', 'v-rule dot dot-open'],
        ['11', 'hairline + dot on the rule', 'v-hair dot dot-on-rule'],
        ['12', 'no rule, dot leader to the sentence', 'leader dot dot-ink'],
      ];

      const esc = (s) =>
        s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

      function tableFor(cls) {
        const body = ROWS.map(
          (r) => `
        <tr>
          <td>
            <span class="corpus">${esc(r.corpus)}</span>
            <div class="meta">${esc(r.kind)}</div>
            ${r.domain ? `<div class="meta">${esc(r.domain)}</div>` : ''}
          </td>
          <td>${esc(r.pre)}<mark>${esc(r.hit)}</mark>${esc(r.post)}</td>
          <td>${esc(r.ctx)}</td>
        </tr>`,
        ).join('');
        return `
        <table class="${cls}">
          <colgroup><col class="src" /><col class="alb" /><col class="ctx" /></colgroup>
          <thead><tr><th>Source</th><th>Albanian</th><th>Context</th></tr></thead>
          <tbody>${body}</tbody>
        </table>`;
      }

      document.getElementById('variants').innerHTML = VARIANTS.map(
        ([n, name, cls]) => `
        <div class="card">
          <p class="label"><b>${n}</b> · ${name}</p>
          ${tableFor(cls)}
        </div>`,
      ).join('');

      const sentence = (r) =>
        `${esc(r.pre)}<mark>${esc(r.hit)}</mark>${esc(r.post)}`;

      const IDEAS = [
        [
          'A',
          'Cards — each example is its own object; source becomes a chip',
          `<div class="idea cards">${ROWS.map(
            (r) => `<div class="item">
              <span class="chip">${esc(r.corpus)}</span>
              <div class="sent">${sentence(r)}</div>
              <div class="trans">${esc(r.ctx)}</div>
            </div>`,
          ).join('')}</div>`,
        ],
        [
          'B',
          'Quotes — sentence leads at reading size, source demoted to a caption',
          `<div class="idea quotes">${ROWS.map(
            (r) => `<div class="item">
              <div class="sent">${sentence(r)}</div>
              <div class="cap">${esc(r.corpus)} · ${esc(r.kind)}${
                r.domain ? ' · ' + esc(r.domain) : ''
              }</div>
            </div>`,
          ).join('')}</div>`,
        ],
        [
          'C',
          'Stack — Albanian on top, translation indented under it, source right-aligned',
          `<div class="idea stack">${ROWS.map(
            (r) => `<div class="item">
              <div class="head">
                <div class="sent">${sentence(r)}</div>
                <div class="src">${esc(r.corpus)}</div>
              </div>
              <div class="trans">${esc(r.ctx)}</div>
            </div>`,
          ).join('')}</div>`,
        ],
        [
          'D',
          'Gutter — corpus reduced to a monospace tag in a narrow left rail',
          `<div class="idea gutter">${ROWS.map(
            (r) => `<div class="item">
              <div class="tag">${esc(r.tag)}</div>
              <div>
                <div class="sent">${sentence(r)}</div>
                <div class="trans">${esc(r.ctx)}</div>
              </div>
            </div>`,
          ).join('')}</div>`,
        ],
        [
          'E',
          'One line each — scan first, expand on hover (fits 8 rows in a third of the height)',
          `<div class="idea oneline">${ROWS.map(
            (r) => `<div class="item">
              <div class="sent">${sentence(r)}</div>
              <div class="src">${esc(r.corpus)}</div>
            </div>`,
          ).join('')}<p class="hint">hover a row to unwrap it</p></div>`,
        ],
      ];

      document.getElementById('ideas').innerHTML = IDEAS.map(
        ([n, name, html]) => `
        <div class="card">
          <p class="label"><b>${n}</b> · ${name}</p>
          ${html}
        </div>`,
      ).join('');
    </script>
  </body>
</html>
